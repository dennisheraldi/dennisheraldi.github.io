# Site settings
title: Dennis Heraldi
tagline: Software Engineer
description: Software engineer experienced in integrating diverse microservices into unified solutions. Adaptive to new tech, focused on building reliable, failure-tolerant systems.
author: Fachry Dennis Heraldi
email: fd.heraldi@gmail.com
url: "https://dennisheraldi.github.io"
baseurl: ""

# Social links
github_username: dennisheraldi
linkedin_username: dennisheraldi

# Default Open Graph / Twitter image used by jekyll-seo-tag on every page
# (overridable per-page via `image:` in front matter).
image: /public/img/og-image.jpg

# Upgrade Twitter card to large image (was summary by default).
twitter:
  username: dennisheraldi
  card: summary_large_image

# Used by jekyll-seo-tag to emit Person sameAs links.
social:
  name: Fachry Dennis Heraldi
  links:
    - https://linkedin.com/in/dennisheraldi
    - https://github.com/dennisheraldi

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Disable default theme from github-pages gem
theme: null
remote_theme: null

# Sass settings - disable SCSS processing to avoid overwriting Tailwind
sass:
  style: compressed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - README.md
  - tailwind.config.js
  - resume/_template.typ
  - resume/resume-swe.typ
  - resume/resume-academic.typ

# Include generated files
include:
  - resume/resume.pdf
  - resume/resume-swe.pdf
  - resume/resume-academic.pdf

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      image: /public/img/og-image.jpg

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

