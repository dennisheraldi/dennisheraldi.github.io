# Publications & Awards. Used by the academic CV (resume-academic.typ) and the
# SWE resume (resume-swe.typ), filtered by audience.
#
# Schema:
#   title:      paper/project/award title
#   venue:      conference name or hosting organization (italic on PDF)
#   location:   right-aligned next to title on PDF
#   date:       month + year
#   authors:    "F. D. Heraldi, A. Co-Author, ..." (leave null if N/A)
#   audience:   one of "both" (default), "swe", "academic". Filters which PDF
#               picks up the entry.
#   highlights: bullets describing contribution and impact

- title: Effective Intended Sarcasm Detection Using Fine-Tuned Llama 2 Large Language Models
  venue: International Conference on Advanced Informatics (ICAICTA 2024)
  location: Singapore
  date: September 2024
  authors: Fachry Dennis Heraldi and Fariska Zakhralativa Ruskanda
  audience: both
  highlights:
    - "**Best Paper Award.** Fine-tuned Llama 2 with QLoRA on **21,599 samples**, achieving **0.6867 F1** for sarcasm detection and **0.90 accuracy** for pairwise sarcasm identification."

- title: RubBot Waste Recognition System
  venue: Green Our Campus Paper Competition
  location: Institut Teknologi Bandung
  date: November 2023
  authors: null
  audience: academic
  highlights:
    - "**First Place Winner.** Prototyped a Vision Transformer-based waste classifier connected to an IoT sorting system."
