# Detailed work experience used by both PDF resumes.
# The shorter homepage copy lives in website_experience.yml.
#
# Highlight bullets accept simple Markdown:
#   **text**  -> bold (rendered on web and both PDFs)
#   *text*    -> italic
# Stick to those two; keep bullets one paragraph each (no line breaks).
#
# `period_full` -> long label used on the PDF
#
# Per-audience bullets (optional):
#   highlights            -> always shown in both PDFs
#   highlights_swe        -> appended on the SWE resume only
#   highlights_academic   -> appended on the academic CV only
#
# Per-entry audience filter (optional):
#   audience: both        -> default; entry shows on both PDFs
#   audience: swe         -> only on the SWE resume
#   audience: academic    -> only on the academic CV

